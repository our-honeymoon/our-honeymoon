<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Honeymoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#3d3538;font:400 .98rem/1.7 'Gowun Dodum','Helvetica Neue',Arial,sans-serif;padding:24px}
.box{position:relative;text-align:center;width:min(340px,100%)}
.sun{position:absolute;left:50%;top:-70px;width:220px;height:220px;margin-left:-110px;border-radius:50%;background:#fbeff0}
.box>*:not(.sun){position:relative}
h1{font:400 2.6rem/1.2 'Gowun Batang',Georgia,serif;margin:0;letter-spacing:.02em}
p{margin:8px 0 28px;color:#9b8f93;font-size:.93rem}
form{display:flex;gap:12px;align-items:end}
input[type=password]{flex:1;min-width:0;font:inherit;padding:9px 2px;border:0;border-bottom:1px solid #e6b3bb;background:transparent;border-radius:0;text-align:center;letter-spacing:.2em}
button{font:inherit;background:none;border:1px solid #b0586a;color:#b0586a;border-radius:999px;padding:7px 20px;cursor:pointer}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible{outline:1px solid #b0586a;outline-offset:4px}
label{display:block;margin-top:18px;font-size:.85rem;color:#9b8f93;cursor:pointer}
#e{min-height:1.5em;margin-top:14px;color:#b0586a;font-size:.9rem}
</style>
</head>
<body>
<div class="box">
  <div class="sun"></div>
  <h1>Honeymoon</h1>
  <p>Enter the passcode to open.</p>
  <form id="f">
    <input id="p" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Passcode" aria-label="Passcode" autofocus>
    <button id="b">Open</button>
  </form>
  <label><input type="checkbox" id="r" checked> Remember on this device</label>
  <div id="e" role="alert"></div>
</div>

function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function say(t){document.getElementById("e").textContent=t}
async function openWith(key){
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.i)},key,b64(D.c));
  var html=new TextDecoder().decode(pt);
  if(document.readyState!=="complete")await new Promise(function(r){window.addEventListener("load",r,{once:true})});
  document.open();document.write(html);document.close();
}
async function derive(pw){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.s),iterations:D.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async function(){
  if(!window.crypto||!crypto.subtle){say("Please open this page over a secure (https) link.");return}
  try{
    var saved=localStorage.getItem("hm-key");
    if(saved){
      try{await openWith(await crypto.subtle.importKey("raw",b64(saved),"AES-GCM",false,["decrypt"]));return}
      catch(e){localStorage.removeItem("hm-key")}
    }
  }catch(e){}
  document.getElementById("f").onsubmit=async function(ev){
    ev.preventDefault();
    var pw=document.getElementById("p").value.trim().toLowerCase(),btn=document.getElementById("b");
    if(!pw)return;
    btn.disabled=true;btn.textContent="Opening…";say("");
    try{
      var key=await derive(pw);
      var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.i)},key,b64(D.c));
      if(document.getElementById("r").checked){
        try{var raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));localStorage.setItem("hm-key",btoa(String.fromCharCode.apply(null,raw)))}catch(e){}
      }
      document.open();document.write(new TextDecoder().decode(pt));document.close();
    }catch(e){
      say("That passcode didn’t work. Try again.");btn.disabled=false;btn.textContent="Open";
    }
  };
})();
